name: Vote CI Build Test

on:
  push:
    branches:
      - main
    paths:
      - 'vote/**'
      - '.github/workflows/call-docker-build-vote.yaml'

  pull_request:
    branches:
      - main
    paths:
      - 'vote/**'
      - '.github/workflows/call-docker-build-vote.yaml'

  workflow_dispatch:

jobs:
  build-test:
    name: Build Test Vote Service
    runs-on: self-hosted

    permissions:
      contents: read

    steps:

      ###########################################
      # Checkout
      ###########################################

      - name: Checkout Code
        uses: actions/checkout@v4

      ###########################################
      # Build Docker Image
      ###########################################

      - name: Build Docker Image
        run: |
          docker build \
            -t vote:test \
            ./vote

      ###########################################
      # Run Container
      ###########################################

      - name: Start Container
        run: |
          docker run -d \
            --name vote-app \
            -p 8080:80 \
            vote:test

      ###########################################
      # Wait For Startup
      ###########################################

      - name: Wait For Container
        run: sleep 15

      ###########################################
      # Smoke Test
      ###########################################

      - name: Smoke Test
        run: |
          for i in {1..20}
          do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 || true)

            if [ "$STATUS" = "200" ]; then
              echo "Application is healthy"
              exit 0
            fi

            echo "Attempt $i of 20"
            sleep 5
          done

          echo "Application failed"

          docker logs vote-app

          exit 1

      ###########################################
      # Show Logs
      ###########################################

      - name: Container Logs
        if: always()
        run: |
          docker logs vote-app || true

      ###########################################
      # Cleanup
      ###########################################

      - name: Cleanup
        if: always()
        run: |
          docker rm -f vote-app || true
          docker image prune -af || true
