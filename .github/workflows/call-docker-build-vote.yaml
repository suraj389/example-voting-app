name: React CI Build Test

on:
  push:
    branches:
      - main
      - develop
      - feature/**

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  build-test:
    name: Build Test Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      ####################################################
      # Checkout
      ####################################################

      - name: Checkout Code
        uses: actions/checkout@v4

      ####################################################
      # Setup Node
      ####################################################

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      ####################################################
      # Install Dependencies
      ####################################################

      - name: Install Dependencies
        run: npm ci

      ####################################################
      # Lint
      ####################################################

      - name: Run Lint
        run: npm run lint --if-present

      ####################################################
      # Build Application
      ####################################################

      - name: Build React Application
        run: npm run build

      ####################################################
      # Docker Setup
      ####################################################

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      ####################################################
      # Docker Build
      ####################################################

      - name: Build Docker Image
        run: |
          docker build \
            -t ddm-web-app:test \
            .

      ####################################################
      # Trivy Scan
      ####################################################

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ddm-web-app:test
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      ####################################################
      # Run Container
      ####################################################

      - name: Start Container
        run: |
          docker run -d \
            --name react-app \
            -p 8080:80 \
            ddm-web-app:test

      ####################################################
      # Smoke Test
      ####################################################

      - name: Smoke Test
        run: |

          echo "Waiting for application..."

          for i in {1..20}
          do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 || true)

            if [ "$STATUS" = "200" ]; then
              echo "Application is healthy"
              exit 0
            fi

            echo "Attempt $i/20"
            sleep 5
          done

          echo "Application failed health check"

          docker logs react-app

          exit 1

      ####################################################
      # Container Logs
      ####################################################

      - name: Show Container Logs
        if: always()
        run: |
          docker logs react-app || true

      ####################################################
      # Cleanup
      ####################################################

      - name: Cleanup
        if: always()
        run: |
          docker rm -f react-app || true
          docker image prune -af || true
